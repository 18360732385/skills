# Contract domain registry (0.3.7+)
# - Meta for score/seed/plan: weight, truths_dir, detect
# - L1 file packs: templates/_meta/domain-packs.yaml（render 按 params.domains 展开）
# Process packs (releases / frontend) and behavior packs (rule 21) are NOT scored — see glossary「过程包」「行为包」.
# schema_version: 0.5.2 — 域注册表 schema（≠ skill_version；技能号见 manifest.yaml）

version: "0.5.2"

domains:
  api:
    kind: contract
    ladder: L1
    label: API
    index: api.md
    truths_dir: modules
    rule_id: "12"
    weight: 0.35
    morph_cap: 100
    optional: false
    pack: api
    scan_fill_work: true
    hook_code: ["/\/controllers?\//", "/\/dto\//", "/packages\/api-client\//", "/packages\/types\//", "/packages\/queries\//"]
    hook_docs: "docs/api/modules/"
    hook_tip: "rule 12：先同步 docs/api/modules 模块真相（索引/archive 不算）；前端契约包（api-client/types/queries）与 dto/ 亦须先真相后代码"
  func:
    kind: contract
    ladder: L1
    label: Service
    index: func.md
    truths_dir: modules
    rule_id: "11"
    weight: 0.25
    morph_cap: 100
    optional: false
    pack: func
    # 0.7.37: narrow /service/ (avoid clinic-service module path + entity under service/)
    hook_code: ["/Service(Impl)?\\.java$/", "/\/plugin\/tools\//"]
    hook_docs: "docs/func/modules/"
    hook_tip: "rule 11：同步 docs/func/modules 模块真相（索引/archive 不算）"
  db:
    kind: contract
    ladder: L1
    label: DB Table
    index: db.md
    truths_dir: table
    rule_id: "13"
    weight: 0.25
    morph_cap: 100
    optional: false
    pack: db
    migration_modes: [flyway, manual_sql, none]
    hook_code: ["/db\/migration\//", "/\/domain\/entity\//"]
    hook_docs: "docs/db/table/"
    hook_tip: "rule 13：同步 docs/db/table 表真相 + _change.sql（索引/archive 不算）"
    hook_migration_dir: "db/migration/"
    # 0.7.49 可选（空=禁用）：dev 账本自动 status 命令；例 "python scripts/apply_env_migrations.py --env dev --status"
    hook_env_status_cmd: ""
    # 0.7.49 可选（空=禁用）：迁移命名生成脚本（commit 软提醒）；例 "scripts/new_migration.py"
    hook_new_script: ""
    # 0.7.50 可选（空=单轨）：存量旧格式正则（新增/改名仍用旧格式 → 专属软提醒）；例 "^V\\d{4}_\\d__(DDL|DML)__[a-z0-9_]+\\.sql$"
    hook_old_name_re: ""
    note: "迁移模式由 Q_DB_MIGRATION 选定并写入 docs/db/db.md 声明；detect S_NO_FLYWAY/S_SQL_DIR → 荐 manual_sql"
  redis:
    kind: contract
    ladder: L1
    label: Redis Key
    index: redis.md
    truths_dir: keys
    rule_id: "16"
    weight: 0.15
    morph_cap: 100
    optional: true
    detect: [S_REDIS, S_STACK_REDIS]
    pack: redis
    hook_code: ["/\/cache\//", "/\/redis\//"]
    hook_docs: "docs/redis/keys/"
    hook_tip: "rule 16：同步 docs/redis/keys 键真相（索引/archive 不算）"
  jobs:
    kind: contract
    ladder: L1
    label: Job Task
    index: jobs.md
    truths_dir: tasks
    rule_id: "20"
    weight: 0.10
    morph_cap: 100
    optional: true
    detect: [S_JOBS]
    pack: jobs
    inventory: fill-inventory.mjs --domain jobs
    scan_fill_work: true
    hook_code: ["/\/scheduler\//", "/\/jobs?\//"]
    hook_docs: "docs/jobs/tasks/"
    hook_tip: "rule 20：同步 docs/jobs/tasks 任务真相 + 四件套（索引/archive 不算）"
    hook_yml_re: "(application[^/]*\\.ya?ml|config/.*\\.ya?ml)$"
    note: "Cron / Scheduler / Registry 调度契约；非 OpenAPI 字段表"
  design:
    kind: contract
    ladder: L1
    label: Design System
    index: design.md
    truths_dir: modules
    rule_id: "102"
    weight: 0.30
    morph_cap: 100
    optional: false
    detect: [S_FRONTEND]
    pack: design
    inventory: fill-inventory.mjs --domain design
    scan_fill_work: true
    hook_code: ["/(theme|tokens|styles)\//", "/tailwind\.(config|theme)\./", "/unocss\.config\./", "/\.(style|design)-system\./"]
    hook_docs: "docs/design/modules/"
    hook_tip: "rule 102：改视觉/主题/token 前先同步 docs/design/modules 设计真相（索引/archive 不算）；运行代码（tokens.css 等）留原地，非运行文档经确认归档 docs/design/"
    note: "0.8.0 前端域：token/主题/风格/禁库；repo_kind=frontend|fullstack 时默认启用"
  prototype:
    kind: contract
    ladder: L1
    label: UI Prototype
    index: prototype.md
    truths_dir: modules
    rule_id: "103"
    weight: 0.20
    morph_cap: 100
    optional: false
    detect: [S_FRONTEND]
    pack: prototype
    inventory: fill-inventory.mjs --domain prototype
    scan_fill_work: true
    hook_code: ["/ui-prototypes\//", "/docs\/prototype\//", "/(prototypes?|mockups?|wireframes?)\//"]
    hook_docs: "docs/prototype/modules/"
    hook_tip: "rule 103：原型/高保真变更须回写 docs/prototype/modules 索引与页面映射（索引/archive 不算）；非运行原型资产经确认归档 docs/prototype/"
    note: "0.8.0 前端域：原型图/高保真 HTML/外链索引（非运行时）；多根扫描归一 SSOT"
  pages:
    kind: contract
    ladder: L1
    label: Page Route
    index: pages.md
    truths_dir: modules
    rule_id: "105"
    weight: 0.15
    morph_cap: 100
    optional: true
    detect: [S_FRONTEND]
    pack: pages
    hook_code: ["/(pages?|views?|routes?|screens?)\//"]
    hook_docs: "docs/pages/modules/"
    hook_tip: "rule 105：页面/路由职责或原型映射变更须同步 docs/pages/modules（0.8.0 索引壳）"
    note: "0.8.0 索引壳：先落索引与 rule；精填 inventory 与升严计分 0.8.1+"
  components:
    kind: contract
    ladder: L1
    label: UI Component
    index: components.md
    truths_dir: modules
    rule_id: "104"
    weight: 0.20
    morph_cap: 100
    optional: true
    detect: [S_FRONTEND]
    pack: components
    hook_code: ["/components?\//", "/widgets?\//"]
    hook_docs: "docs/components/modules/"
    hook_tip: "rule 104：组件/控件库/变体变更须同步 docs/components/modules（0.8.0 索引壳）"
    note: "0.8.0 索引壳：先落索引与 rule；精填 inventory 与升严计分 0.8.1+"
  client-api:
    kind: contract
    ladder: L1
    label: Client API
    index: client-api.md
    truths_dir: modules
    rule_id: "106"
    weight: 0.15
    morph_cap: 100
    optional: true
    detect: [S_FRONTEND]
    pack: client-api
    hook_code: ["/api-client\//", "/queries\//", "/packages\/types\//", "/services\/api\//"]
    hook_docs: "docs/client-api/modules/"
    hook_tip: "rule 106：前端契约消费层（api-client/types/queries）变更须同步 docs/client-api/modules（0.8.0 索引壳；提供侧契约走 rule 12）"
    note: "0.8.0 索引壳：fullstack 与 api 域分工见 glossary（消费侧 vs 提供侧）；精填 0.8.1+"

# Non-scored packs (detect / audit footnotes only)
packs:
  releases:
    kind: process
    paths: [docs/releases]
    skill_hint: release-eng
  frontend:
    kind: collab
    paths: ["**/apps/**", "**/packages/**", "**/*-web/**"]
    rule_hint: "101-frontend-*"
    detect: [S_FRONTEND]
    note: "前端总触发协作包（rule 101，0.7.x 曾用 17 号）；契约域走 design/prototype/pages/components/client-api（0.8.0+）"
  behavior:
    kind: behavior
    rule_hint: "21-observability-*"
    detect: [S_SLF4J]
    note: "后端日志/中文注释行为约束（rule 21）；非契约域，不进 fill-score 权重"
