# L1 contract domain file packs (0.3.7+)
# SSOT for land/render of contract domains. Selected via params.domains.
# Non-domain ladder files (L0/L2/L3/L4) stay in manifest.yaml.

version: "0.3.8"

func:
  - id: func-index
    ladder: L1
    domain: func
    template: docs/func/func.md.tmpl
    target: docs/func/func.md
    placeholders: [REPO_NAME, REPO_DESC]
  - id: func-modules-readme
    ladder: L1
    domain: func
    template: docs/func/modules/README.md
    target: docs/func/modules/README.md
  - id: func-tmpl
    ladder: L1
    domain: func
    template: docs/func/templates/func-template.md
    target: docs/func/templates/func-template.md
    placeholders: [BASE_PACKAGE]
  - id: func-index-tmpl
    ladder: L1
    domain: func
    template: docs/func/templates/func-index-template.md
    target: docs/func/templates/func-index-template.md
    placeholders: [REPO_NAME]
  - id: rule-11
    ladder: L1
    domain: func
    template: rules/11-func-sync.mdc.tmpl
    target: .cursor/rules/11-func-sync-rules.mdc
    placeholders: [GLOB_FUNC]

