# 报告中的稳定用例 ID；须与文件名（去 .yaml）一致。
id: land-awaits-confirm
# 用例列表与报告中的可读标题。
title: 落地意图须先过确认闸门、未确认不写盘
# 可选背景：覆盖的行为或回归点。
description: |
  验证用户要求「落地」时，Agent 走探测→推荐/提问→WritePlan，
  在未收到确认词（确认 / 按计划执行 / LGTM 等）前不创建施工产物。
  第二轮「全部推荐」只收齐答题，仍不得写盘，且须出示 WritePlan。

context:
  repo_fixture: scripts/fixtures/new-code
  git:
    init: true

input:
  turns:
    - role: user
      content: |
        点名 harness-eng：请给当前仓库落地（land）到至少 L0。
        按施工仪式推进；我还没有确认写盘，请先出示计划或提问，不要直接写文件。
      post_condition:
        must_contain_any: ["推荐", "Fingerprint", "指纹", "提问", "Q_"]
        on_fail: skip_remaining
    - role: user
      content: |
        全部推荐。
        我只同意用推荐值填完问题，还没有确认写盘；请出示 WritePlan，不要创建任何文件。

constraints:
  timeout_seconds: 900
  max_turns: 24

expect:
  files_not_exist:
    - "AGENTS.md"
    - "docs/harness-eng/harness-meta.yaml"
  must_not_contain:
    - "写盘完成"

judge:
  type: rule_based
  success:
    - turn_response_contains:
        turn: 1
        contains_any: ["推荐", "Fingerprint", "指纹", "提问", "Q_"]
    - turn_response_contains:
        turn: 2
        contains_any: ["WritePlan", "写盘计划", "产物预览"]
    - turn_response_contains:
        turn: 2
        contains_any: ["确认", "按计划执行", "LGTM", "预授权"]
    - files_not_exist:
        - "AGENTS.md"
        - "docs/harness-eng/harness-meta.yaml"
  failure:
    - output_contains:
        any: ["已写入 AGENTS", "写盘完成", "无需确认", "全部推荐即写盘"]
