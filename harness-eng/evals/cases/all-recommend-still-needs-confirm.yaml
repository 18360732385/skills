# 报告中的稳定用例 ID；须与文件名（去 .yaml）一致。
id: all-recommend-still-needs-confirm
# 用例列表与报告中的可读标题。
title: 全部推荐只收齐答题、写盘仍须确认
# 可选背景：覆盖的行为或回归点。
description: |
  对照 write-plan / recommended-profile：用户说「全部推荐」只表示收齐答题，
  不等于确认写盘。多轮场景下第二轮「全部推荐」后仍不得创建 AGENTS / harness-meta。

context:
  repo_fixture: scripts/fixtures/new-code
  git:
    init: true

input:
  turns:
    - role: user
      content: |
        点名 harness-eng：请给当前仓库落地（land）到 L2。
        先按施工仪式提问或出示推荐包；本轮不要写文件。
      post_condition:
        must_contain_any: ["推荐", "WritePlan", "确认", "Q_", "提问", "Fingerprint", "指纹"]
        on_fail: skip_remaining
    - role: user
      content: |
        全部推荐。
        注意：我只同意用推荐值填完问题，还没有确认写盘，请不要创建任何文件。

constraints:
  timeout_seconds: 900
  max_turns: 24

expect:
  files_not_exist:
    - "AGENTS.md"
    - "docs/harness-eng/harness-meta.yaml"
  must_not_contain:
    - "写盘完成"

judge:
  type: rule_based
  success:
    - files_not_exist:
        - "AGENTS.md"
        - "docs/harness-eng/harness-meta.yaml"
    - output_contains:
        any: ["确认", "WritePlan", "按计划执行", "LGTM", "预授权"]
  failure:
    - output_contains:
        any: ["已写入 AGENTS", "写盘完成", "全部推荐即写盘"]
