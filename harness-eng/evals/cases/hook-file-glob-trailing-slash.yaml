# 报告中的稳定用例 ID；须与文件名（去 .yaml）一致。
id: hook-file-glob-trailing-slash
# 用例列表与报告中的可读标题。
title: 文件级 glob 被追加 / 后须警示永不命中
# 可选背景：覆盖的行为或回归点。
description: |
  来自 e2e HS-2 / R11：不含 * 的文件级 glob（如 .../task/Task.java）会被追加 /，
  变成永不命中的前缀；**/common/** 还会变成双斜杠。Agent 规划实体/单文件
  soft-gate 时须警示，并建议实测或改用带通配的写法。

context:
  repo_fixture: scripts/fixtures/stack-monorepo-fe-be
  git:
    init: true
  files:
    "backend/src/main/java/com/example/taskboard/task/Task.java": |
      package com.example.taskboard.task;
      public class Task {
        private Long id;
      }
    "backend/src/main/java/com/example/taskboard/common/ErrorResponse.java": |
      package com.example.taskboard.common;
      public record ErrorResponse(String code, String message) {}

input:
  prompt: |
    点名 harness-eng：有人想在 soft-gate / CONTRACT_CHECKS 里用精确文件 glob：
    backend/src/main/java/com/example/taskboard/task/Task.java
    以及 **/common/**。请说明当前 hooks-checks 的 glob→regex 对这些写法是否可靠；
    若会失效，现象是什么、怎么验证。不要写文件。

constraints:
  timeout_seconds: 600
  max_turns: 20

expect:
  must_not_contain:
    - "已写入"

judge:
  type: rule_based
  success:
    - output_contains:
        any: ["文件级", "精确", "尾斜杠", "追加 /", "前缀", "永不", "不命中", "失效"]
    - output_contains:
        any: ["glob", "正则", "regex", "hook", "soft-gate"]
    - output_contains:
        any: ["Task.java", "common", "双斜杠", "//", "风险", "实测", "验证"]
  failure:
    - output_contains:
        any: ["精确文件路径一定可靠", "追加 / 不影响匹配", "无需验证文件级 glob"]
