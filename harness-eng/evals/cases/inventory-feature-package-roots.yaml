# 报告中的稳定用例 ID；须与文件名（去 .yaml）一致。
id: inventory-feature-package-roots
# 用例列表与报告中的可读标题。
title: 业务分包+Flyway 须显式 inventory 根参数
# 可选背景：覆盖的行为或回归点。
description: |
  来自 e2e FC-2 / FC-3 / ID-3：package-by-feature 时默认 inventory-api 只数到首个
  Controller 目录；db 默认 --sql-root file 找不到 Flyway。Agent 规划 fill-inventory
  时应给出 --controller-root 与迁移目录/--sql-root，且本轮不写盘。

context:
  repo_fixture: scripts/fixtures/stack-monorepo-fe-be
  git:
    init: true
  files:
    "backend/src/main/java/com/example/taskboard/task/TaskController.java": |
      package com.example.taskboard.task;
      import org.springframework.web.bind.annotation.*;
      @RestController
      @RequestMapping("/api/tasks")
      public class TaskController {
        @GetMapping public String list() { return "[]"; }
      }
    "backend/src/main/java/com/example/taskboard/project/ProjectController.java": |
      package com.example.taskboard.project;
      import org.springframework.web.bind.annotation.*;
      @RestController
      @RequestMapping("/api/projects")
      public class ProjectController {
        @GetMapping public String list() { return "[]"; }
      }
    "backend/src/main/resources/db/migration/V1__init_schema.sql": |
      CREATE TABLE task (id BIGINT PRIMARY KEY, title VARCHAR(128) NOT NULL);

input:
  prompt: |
    点名 harness-eng：这是前后端 monorepo，后端按业务分包（task/project 各有 Controller），
    迁移在 backend/src/main/resources/db/migration（Flyway）。
    请规划 fill-inventory（api + db）要怎么跑，才能数全接口并找到迁移；
    说明默认参数的陷阱。本轮只给命令与参数建议，不要写文件、不要执行会改仓的命令。

constraints:
  timeout_seconds: 600
  max_turns: 20

expect:
  must_not_contain:
    - "写盘完成"

judge:
  type: rule_based
  success:
    - output_contains:
        any: ["controller-root", "--controller-root", "Controller 根"]
    - output_contains:
        any: ["sql-root", "--sql-root", "db/migration", "migration"]
    - output_contains:
        any: ["inventory", "fill-inventory"]
  failure:
    - output_contains:
        any: ["默认参数即可数全", "无需 controller-root", "sql-root 用 file 即可"]
