# feature-eng 版本清单（权威号）

version: "0.2.0"
source_repo: c-be-sms-ai
portable: copy-skill-dir
harness_land: false
description: >-
  开发流程控制器 skill：分诊 S/B/F；环节与 skill 解耦（config/stage-bindings.yaml 入库）；
  绑定为推荐包（init/rebind 首问必选）；人侧入口 start/resume/close/init|rebind；
  invoke strict|inline；run_mode guided|express；progress/links 仅控制器写；
  调起传指针卡片；过程态 docs/superpowers/runs/<slug>/；产物校验 artifacts.md；
  Proto 自判桥（含跨仓提示）；TestDesign 与 Verify 仅 F；close 为 skill 内收口规则。

modes:
  - init
  - rebind
  - start
  - resume
  - status
  - advance
  - close

config:
  - config/stage-bindings.yaml
  - config/stage-bindings.example.yaml

templates:
  - templates/progress.yaml.tmpl
  - templates/links.md.tmpl
  - templates/testcases.md.tmpl
  - templates/test-report.md.tmpl

runs_root: docs/superpowers/runs/
