# feature-eng 版本清单（权威号）

version: "0.2.2"
source_repo: c-be-sms-ai
portable: copy-skill-dir
harness_land: false
description: >-
  开发流程控制器 skill：分诊 S/B/F；环节与 skill 解耦；绑定推荐包（中文名+产物表）；
  invoke strict|inline；handoff_policy auto|confirm（过闸后主动调起下一 skill）；
  review_policy subagent|inline（L2 语义审核）；artifacts=L1、gates-review=L2；
  domain 条件桥；Proto 展示结论可推翻；禁止主题写根 CONTEXT.md；
  过程态 docs/superpowers/runs/<slug>/；TestDesign/Verify 仅 F；close 内收口。

modes:
  - init
  - rebind
  - start
  - resume
  - status
  - advance
  - close

config:
  - config/stage-bindings.yaml
  - config/stage-bindings.example.yaml

templates:
  - templates/progress.yaml.tmpl
  - templates/links.md.tmpl
  - templates/testcases.md.tmpl
  - templates/test-report.md.tmpl

runs_root: docs/superpowers/runs/
