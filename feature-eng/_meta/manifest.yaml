# feature-eng 版本清单（权威号）

version: "0.1.3"
source_repo: c-be-sms-ai
portable: copy-skill-dir
harness_land: false
description: >-
  开发流程控制器 skill：分诊 S/B/F；环节与 skill 解耦（config/stage-bindings.yaml 入库）；
  绑定为推荐包（init/rebind 首问必选）；init 扫描安装 / rebind 改映射；
  start/resume/status/advance/close；过程态 docs/superpowers/runs/<slug>/；
  Proto 自判桥；TestDesign 与 Verify 仅 F；close 为 skill 内收口规则；
  控制器不写业务代码、不干扰子 skill 领域运行（可传环截断指令）。

modes:
  - init
  - rebind
  - start
  - resume
  - status
  - advance
  - close

config:
  - config/stage-bindings.yaml
  - config/stage-bindings.example.yaml

templates:
  - templates/progress.yaml.tmpl
  - templates/links.md.tmpl
  - templates/testcases.md.tmpl
  - templates/test-report.md.tmpl

runs_root: docs/superpowers/runs/
