# release-eng 版本清单（权威号）

version: "0.4.8"
source_repo: c-be-sms-ai
portable: copy-skill-dir
harness_land: false
description: >-
  发版仪式 skill（仅用户点名）：prepare（半自动，吞 resume）/audit/seal/cancel；
  身份 release-V{yyMMdd}；push-gate → freeze → WritePlan/note-merge → seal-check；
  定版/seal 自动生成发版单同名 html 只读渲染（note-html）；仓内快照对账；notes/ 已移除；ai-track 默认跳过；非 harness land。见 CHANGELOG。

modes_dir: modes/
modes:
  - prepare
  - audit
  - seal
  - cancel

scripts:
  - scripts/release.mjs
  - scripts/release-prepare.mjs
  - scripts/release-cancel.mjs
  - scripts/release-sync-scripts.mjs
  - scripts/release-migrate-notes.mjs
  - scripts/release-format.mjs
  - scripts/release-push-gate.mjs
  - scripts/release-freeze.mjs
  - scripts/release-freeze-enrich.mjs
  - scripts/release-ai-track.mjs
  - scripts/release-sql-classify.mjs
  - scripts/release-sql-bundle.mjs
  - scripts/release-sql-profile.mjs
  - scripts/release-sql-stats.mjs
  - scripts/release-note-merge.mjs
  - scripts/release-note-html.mjs
  - scripts/release-seal-check.mjs
  - scripts/release-seal.mjs
  - scripts/selfcheck.mjs

fixtures: fixtures/docs/releases/
docs_truth: docs/releases/
