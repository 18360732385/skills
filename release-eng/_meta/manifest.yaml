# release-eng 版本清单（权威号）

version: "0.3.33"
source_repo: c-be-sms-ai
portable: copy-skill-dir
harness_land: false
description: >-
  发版仪式 skill（仅用户点名）：prepare/resume/audit/seal；
  push-gate → freeze → WritePlan/note-merge → seal-check；
  变更对象 + 双源去重 + artifacts.json；键级diff；sql/refs + sql-bundle；
  双轨研判；逾期硬闸；首次发版基线=无；非 harness land。补丁史见 CHANGELOG。

modes_dir: modes/
modes:
  - prepare
  - resume
  - audit
  - seal

scripts:
  - scripts/release.mjs
  - scripts/release-format.mjs
  - scripts/release-push-gate.mjs
  - scripts/release-freeze.mjs
  - scripts/release-freeze-enrich.mjs
  - scripts/release-ai-track.mjs
  - scripts/release-sql-classify.mjs
  - scripts/release-sql-bundle.mjs
  - scripts/release-note-merge.mjs
  - scripts/release-seal-check.mjs
  - scripts/release-seal.mjs
  - scripts/selfcheck.mjs

fixtures: fixtures/docs/releases/
docs_truth: docs/releases/
